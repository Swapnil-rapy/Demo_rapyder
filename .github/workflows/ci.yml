name: Sample Application CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: sample-app

jobs:

  build-test:
    name: Build and  Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests
        working-directory: ./application
        run: mvn clean test

      - name: Build application
        working-directory: ./application
        run: mvn clean package -DskipTests


  docker:
    name: Build and Push Docker Image
    needs: build-test

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build Docker image
        working-directory: ./application
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .


      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG



  update-gitops:
    name: Update GitOps Repository

    needs: docker

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: swapnil-rapy/Gitops-repo
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops


      - name: Update image tag
        working-directory: Gitops-repo/helm_charts/
        env:
          IMAGE_TAG: ${{ github.sha }}

        run: |
          sed -i "s/tag: .*/tag: \"$IMAGE_TAG\"/" values.yaml

      - name: Commit and push GitOps change
        working-directory: Gitops-repo/helm_charts/
        env:
          IMAGE_TAG: ${{ github.sha }}

        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add values.yaml

          git diff --cached --quiet || git commit \
            -m "Update sample-app image to $IMAGE_TAG"

          git push